<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mediaqueries Tailwind</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body class="bg-gray-100 dark:bg-gray-900 contrast-more:contrast-150">
    <header>
      <h1 class="text-5xl font-bold text-center p-5 dark:text-blue-500">Destinos Populares</h1>
    </header>
    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 m-5 p-5 mx-auto max-w-7xl">
        <div class="bg-white h-100 overflow-hidden shadow-lg rounded-xl mb-4 hover:scale-101 hover:shadow-gray-500 transition-all duration-300 dark:bg-gray-800 dark:border dark:border-white">
          <img
            class="w-full h-60 object-cover"
            src="https://thumbs.dreamstime.com/z/paisaje-de-la-monta%C3%B1a-con-un-lago-glacial-y-los-pinos-28435203.jpg?ct=jpeg"
            alt="Paisaje de montaña"
          />
          <div class="px-6 py-4 border-t border-gray-500 dark:border-gray-200 mt-1">
            <h2 class="text-2xl font-bold text-blue-600 dark:text-blue-500">Montañas majestuosas</h2>
            <p class="text-gray-700 text-base h-16 max-w-120 dark:text-white">Explora paisajes impresionantes y respira aire puro.</p>
            <a href="#" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">Ver más</a>
          </div>
        </div>

        <div class="bg-white h-100 overflow-hidden shadow-lg rounded-xl mb-4 hover:scale-101 hover:shadow-gray-500 transition-all duration-300 dark:bg-gray-800">
          <img
            class="w-full h-60 object-cover"
            src="https://plus.unsplash.com/premium_photo-1723867356920-8e05009f3499?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1241"
            alt="Playa tropical"
          />
          <div class="px-6 py-4 border-t border-gray-500 dark:border-gray-200 mt-1">
            <h2 class="text-2xl font-bold text-blue-600 dark:text-blue-500">Playas paradisíacas</h2>
            <p class="text-gray-700 text-base h-16 max-w-120 dark:text-white">Relájate en la arena blanca y disfruta del sol.</p>
            <a href="#" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">Ver más</a>
          </div>
        </div>
        <div class="bg-white h-100 overflow-hidden shadow-lg rounded-xl mb-4 hover:scale-101 hover:shadow-gray-500 transition-all duration-300 dark:bg-gray-800 dark:border dark:border-white">
          <img
            class="w-full h-60 object-cover"
            src="https://foto321.com/wp-content/uploads/2023/08/Pasaric-citiscape-a-contraluz-1536x1024.jpg"
            alt="Ciudad moderna de noche"
          />
          <div class="px-6 py-4 border-t border-gray-500 dark:border-gray-200 mt-1">
            <h2 class="text-2xl font-bold text-blue-600 dark:text-blue-500">Ciudades vibrantes</h2>
            <p class="text-gray-700 text-base h-16 max-w-120 dark:text-white">Descubre la vida nocturna y la cultura urbana.</p>
            <a href="#" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">Ver más</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
